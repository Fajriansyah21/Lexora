name: Synthetic Dataset Tests

on:
  push:
    branches: [main]
    paths:
      - "schemas/dataset-records-v1.schema.json"
      - "scripts/synthetic_dataset_checks.py"
      - "tests/synthetic_dataset/**"
      - "requirements-test.txt"
      - ".github/workflows/synthetic-dataset-tests.yml"
  pull_request:
    paths:
      - "schemas/dataset-records-v1.schema.json"
      - "scripts/synthetic_dataset_checks.py"
      - "tests/synthetic_dataset/**"
      - "requirements-test.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-dataset-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install -r requirements-test.txt
      - name: Run synthetic procedure tests
        run: python -m unittest discover -s tests/synthetic_dataset -p "test_*.py" -v
